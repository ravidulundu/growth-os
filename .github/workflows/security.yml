name: Security

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  schedule:
    - cron: "18 3 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  snyk:
    name: Snyk (optional)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip Snyk (missing token)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN is not configured; skipping Snyk job steps."
      - uses: actions/checkout@v4
        if: env.SNYK_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.SNYK_TOKEN != ''
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        if: env.SNYK_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: env.SNYK_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Snyk Test (high)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: npx snyk test --all-projects --severity-threshold=high
