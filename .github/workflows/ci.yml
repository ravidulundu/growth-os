name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  guardrails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Branch Name Check
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: pnpm branch:check

      - name: Commit Convention Check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin "${BASE_REF}:${BASE_REF}"
          pnpm commitlint --from "origin/${BASE_REF}" --to "${HEAD_SHA}" --verbose

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: growth_os
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growth_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@localhost:55432/growth_os
      REDIS_URL: redis://localhost:56379
      TOKEN_ENCRYPTION_KEY: ci-dev-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate DB
        run: pnpm db:migrate

      - name: Quality Gate
        run: pnpm quality:gate
