name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  guardrails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Branch Name Check
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: pnpm branch:check

      - name: Commit Convention Check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin "${BASE_REF}:${BASE_REF}"
          pnpm commitlint --from "origin/${BASE_REF}" --to "${HEAD_SHA}" --verbose

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Quality Gate
        run: pnpm quality:gate
